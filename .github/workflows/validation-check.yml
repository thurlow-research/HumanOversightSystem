name: Validation Stamp Check

# Verifies that all framework validation phases were run locally before this PR
# was pushed. Does NOT call agy or codex — those run locally only (subscription
# CLI auth cannot run in CI). This check just verifies the stamp is current.
#
# Pass condition (content-hash, #552): a stamp file
# scripts/framework/validation-stamps/phase1-<HASH>.stamp is committed, where
# <HASH> is the SHA-256 of the concatenated contents of every .claude/agents/*.md
# file. Identical agent content always hashes the same, so the stamp survives
# rebase/merge — no commit-timestamp comparison is involved.
#
# Scoped to PRs that touch .claude/agents/** (2026-09-14) — this check has
# nothing to say about a PR that doesn't change agent content, and running it
# unconditionally meant any PR could be blocked by a stamp made stale by an
# unrelated, already-merged agent-file change. Not a GitHub-required status
# check (see setup_branch_protection.sh's required_status_checks.contexts) and
# not read by merge_authority.py's check_required_content_checks (#1580,
# which only considers checks in that same required list) — scoping the
# trigger cannot create a "required check never reports" stall.

on:
  pull_request:
    branches:
      - main
    paths:
      - '.claude/agents/**'

jobs:
  validation-stamp-check:
    name: Validation stamps current
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for commit timestamps)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to compare commit timestamps across branches

      - name: Check validation stamps are current
        run: bash scripts/framework/check_validation_current.sh
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
