name: Tests

# Runs the HOS Python test suite + coverage gate on every PR (#1244).
#
# REQUIRED status check, per the human ruling on #1244 (2026-09-10). The job
# is named `tests`; scripts/framework/setup_branch_protection.sh declares
# `tests` in its required_status_checks.contexts, guarded against drift by
# tests/framework/test_branch_protection_contexts.py — but the live GitHub
# branch-protection setting only takes effect once a human (not a bot; the
# script refuses bot callers) re-runs that script. Until then this job is
# visible on every PR but does not itself block merge.
#
# Retry tolerance, not an override: scripts/framework/run_tests.sh passes
# --reruns 1 to pytest, so a test gets one immediate retry on the same
# commit/environment (2 total attempts) before it's treated as a real
# failure. There is no agent-settable escape hatch (no env var) — the only
# override path is the existing audited contract/gate-suspension.md
# mechanism, same as every other gate.
#
# Runs the same entry point a human runs locally — scripts/framework/run_tests.sh
# — so local and CI cannot diverge (AC in #1244). That script runs pytest +
# coverage only; --mutation is NOT passed here (mutmut re-runs the full suite
# per mutant and is far too slow for a per-PR gate).
#
# Regular `pull_request` (not `pull_request_target`): the job executes the PR's
# own code (the test suite itself), so it must run with the PR head checked out
# and the restricted default GITHUB_TOKEN pull_request grants — never the
# elevated pull_request_target token.
#
# HOS_SKIP_PROJECT_REQUIREMENTS=1 (below): ensure_venv.sh's project-requirements
# step (#956) pip-installs any requirements*.txt found at the repo root — but
# on this trigger the checked-out root is the PR head, so a requirements.txt
# added by the PR itself would be pip-installed here, i.e. arbitrary code
# execution from unreviewed PR content (setup.py, PEP 517 build backends,
# --index-url redirection). This repo is the framework itself, not a consumer
# project with its own app deps, so the project-requirements step has nothing
# legitimate to do here; skip it outright (#1380).

on:
  pull_request:
    branches: [main, "release/v*"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build oversight venv
        env:
          HOS_SKIP_PROJECT_REQUIREMENTS: "1"
        run: bash scripts/oversight/ensure_venv.sh

      - name: Run test suite + coverage gate
        run: bash scripts/framework/run_tests.sh
