name: Tests

# Runs the HOS Python test suite + coverage gate on every PR (#1244).
#
# REQUIRED status check, per the human ruling on #1244 (2026-09-10). The job
# is named `tests`; scripts/framework/setup_branch_protection.sh declares
# `tests` in its required_status_checks.contexts, guarded against drift by
# tests/framework/test_branch_protection_contexts.py — but the live GitHub
# branch-protection setting only takes effect once a human (not a bot; the
# script refuses bot callers) re-runs that script. Until then this job is
# visible on every PR but does not itself block merge.
#
# Retry tolerance, not an override: scripts/framework/run_tests.sh passes
# --reruns 1 to pytest, so a test gets one immediate retry on the same
# commit/environment (2 total attempts) before it's treated as a real
# failure. There is no agent-settable escape hatch (no env var) — the only
# override path is the existing audited contract/gate-suspension.md
# mechanism, same as every other gate.
#
# Runs the same entry point a human runs locally — scripts/framework/run_tests.sh
# — so local and CI cannot diverge (AC in #1244). That script runs pytest +
# coverage only; --mutation is NOT passed here (mutmut re-runs the full suite
# per mutant and is far too slow for a per-PR gate). It also records per-test
# coverage contexts and a sidecar (coverage-meta.json) for the new-code gate
# below; the `tests` job uploads both as the `coverage-contexts` artifact.
#
# New-code gate (#2304; docs/v0.7.0/TECHNICAL-DESIGN-2304-new-code-coverage-mutation-gate.md):
# four jobs hold new and changed Python to 80% line coverage and a 75% mutant
# score (and new shell to the decision-logic guard). The graph is
#   tests -> new-code-plan -> new-code-shard (matrix) -> new-code-gate.
# `new-code-plan` does the cheap work once and writes the plan; the matrix of
# `new-code-shard` legs, which the plan computes, mutates one shard each;
# `new-code-gate` merges the fragments and applies the thresholds. Only
# `new-code-gate` is a required context (declared in
# scripts/framework/hos_required_contexts.txt); the plan and the shard matrix
# are not. The plan, the fragments and the gate all use `if: always()` or pass
# their upstream job results to the gate as arguments, because a job whose
# dependency failed is SKIPPED by default and a skipped required check counts
# as a pass. The gate turns any upstream result other than `success` into
# exit 3, and a shard that fails, is missing, is duplicated or is not bound to
# this run fails the gate closed. No `needs.*` or `matrix.*` expression appears
# inside a `run:` script: such a value reaches the script through a step `env:`
# entry (the plan's outputs come from a job that runs PR code, and an
# expression in `run:` is shell source). There is no override other than a
# human admin merge (#2304 H5); contract/gate-suspension.md does not apply to
# `new-code-gate`. All four jobs work on github.sha, the pull_request merge
# commit.
#
# Regular `pull_request` (not `pull_request_target`): the job executes the PR's
# own code (the test suite itself), so it must run with the PR head checked out
# and the restricted default GITHUB_TOKEN pull_request grants — never the
# elevated pull_request_target token.
#
# HOS_SKIP_PROJECT_REQUIREMENTS=1 (below): ensure_venv.sh's project-requirements
# step (#956) pip-installs any requirements*.txt found at the repo root — but
# on this trigger the checked-out root is the PR head, so a requirements.txt
# added by the PR itself would be pip-installed here, i.e. arbitrary code
# execution from unreviewed PR content (setup.py, PEP 517 build backends,
# --index-url redirection). This repo is the framework itself, not a consumer
# project with its own app deps, so the project-requirements step has nothing
# legitimate to do here; skip it outright (#1380).

on:
  pull_request:
    branches: [main, "release/v*"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # Full history, matching every job in oversight-gates.yml. Not
          # optional: parts of this suite drive the real gates against real
          # repo history, and a gate that resolves a committed artifact's
          # `head_sha` against git (scripts/oversight/secret_scan_logic.py,
          # #1754) cannot do so in the depth-1 clone actions/checkout gives by
          # default — the object is simply not in the clone, so the check fails
          # closed and the gate reports a finding on a required artifact.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build oversight venv
        env:
          HOS_SKIP_PROJECT_REQUIREMENTS: "1"
        run: bash scripts/oversight/ensure_venv.sh

      - name: Run test suite + coverage gate
        env:
          # Read by tests/conftest.py's retry-rescue terminal-summary hook
          # (#1244 ruling item 4) to tag any audit event with the PR it ran
          # against. The write itself is best-effort and does not durably
          # land here — this checkout has `permissions: contents: read` and
          # nothing commits the audit event back — so the RETRY-RESCUE line
          # in this job's own log is what keeps a rescue visible for a
          # contributor PR run. Persisting CI-originated retry-rescue events
          # needs its own write-back design; tracked separately.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/framework/run_tests.sh

      - name: Upload coverage contexts for the new-code gate
        uses: actions/upload-artifact@v4
        with:
          name: coverage-contexts
          path: |
            .coverage
            coverage-meta.json
          retention-days: 7
          if-no-files-found: error
          # A re-run of this job replaces the earlier attempt's artifact rather than
          # failing on the duplicate name (#2304 RV-5).
          overwrite: true
          # .coverage is a dotfile; upload-artifact@v4 skips hidden files by default.
          include-hidden-files: true

  new-code-plan:
    name: new-code-plan
    needs: tests
    # Not `success()`: a skipped job must still run so the gate can report why.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Record job start
        run: date -u +%s > "$RUNNER_TEMP/ncg-job-start"

      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # Full history so <gated>^1 (the base) and <gated>^2 (the PR head) resolve.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build oversight venv
        env:
          HOS_SKIP_PROJECT_REQUIREMENTS: "1"
        run: bash scripts/oversight/ensure_venv.sh

      - name: Download coverage contexts
        # A missing artifact must surface as exit 3 from the gate (which still
        # writes the plan), not as a step error that hides it.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-contexts
          # A fresh directory outside the checkout: PR code cannot pre-place a
          # file (or a symlink) where the gate will read its inputs (#2304 RV-7).
          path: ${{ runner.temp }}/ncg-in/coverage

      - name: Plan new and changed code
        id: plan
        env:
          HOS_TESTS_RESULT: ${{ needs.tests.result }}
        # The -I -c wrapper (text equal to ENTRY_SNIPPET in new_code_gate_logic.py,
        # asserted by WF-ENTRY) keeps cwd and PYTHONPATH off sys.path (#2304 RV2-1).
        # The gate itself appends the count and shards job outputs to GITHUB_OUTPUT.
        run: >-
          scripts/oversight/.venv/bin/python -I -c "import os, sys, types; r = os.path.realpath(sys.argv[1]); p = types.ModuleType('scripts'); p.__path__ = [os.path.join(r, 'scripts')]; sys.modules['scripts'] = p; from scripts.framework.new_code_gate import main; sys.exit(main(sys.argv[2:]))"
          ${{ github.workspace }} plan
          --gated-sha ${{ github.sha }}
          --pr-head-sha ${{ github.event.pull_request.head.sha }}
          --pr ${{ github.event.pull_request.number }}
          --coverage-file ${{ runner.temp }}/ncg-in/coverage/.coverage
          --meta ${{ runner.temp }}/ncg-in/coverage/coverage-meta.json
          --out ${{ runner.temp }}/ncg-out/new-code-plan.json
          --tests-result "$HOS_TESTS_RESULT"
          --run-id ${{ github.run_id }}
          --run-attempt ${{ github.run_attempt }}
          --github-output "$GITHUB_OUTPUT"
          --job-start-file "$RUNNER_TEMP/ncg-job-start"

      - name: Upload new-code plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-code-plan
          path: ${{ runner.temp }}/ncg-out/new-code-plan.json
          # 90 days is the maximum for a public repository. A value above the
          # repository's Artifact and log retention setting is silently capped,
          # so a human verifies the artifact's expires_at after the first run
          # (TD 5.15.3, 5.20.12).
          retention-days: 90
          if-no-files-found: warn
          # Re-running this job replaces the earlier attempt's plan (#2304 RV-5).
          overwrite: true

  new-code-shard:
    name: new-code-shard ${{ matrix.shard }}
    needs: new-code-plan
    # Not `always()`: with no successful plan there is nothing to shard, and the
    # gate fails closed on the plan result.
    if: needs.new-code-plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Every leg finishes, so the merge can name every failed shard.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.new-code-plan.outputs.shards) }}
    steps:
      - name: Record job start
        run: date -u +%s > "$RUNNER_TEMP/ncg-job-start"

      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # A shard needs only the gated tree; parent checks happen in the plan.
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build oversight venv
        env:
          HOS_SKIP_PROJECT_REQUIREMENTS: "1"
        run: bash scripts/oversight/ensure_venv.sh

      - name: Download new-code plan
        # A missing plan must surface as exit 3 from the gate, not as a step error.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: new-code-plan
          path: ${{ runner.temp }}/ncg-in/plan

      - name: Mutate this shard
        env:
          HOS_SHARD_INDEX: ${{ matrix.shard }}
        run: >-
          scripts/oversight/.venv/bin/python -I -c "import os, sys, types; r = os.path.realpath(sys.argv[1]); p = types.ModuleType('scripts'); p.__path__ = [os.path.join(r, 'scripts')]; sys.modules['scripts'] = p; from scripts.framework.new_code_gate import main; sys.exit(main(sys.argv[2:]))"
          ${{ github.workspace }} shard
          --index "$HOS_SHARD_INDEX"
          --job-start-file "$RUNNER_TEMP/ncg-job-start"
          --plan-dir ${{ runner.temp }}/ncg-in/plan
          --gated-sha ${{ github.sha }}
          --pr ${{ github.event.pull_request.number }}
          --run-id ${{ github.run_id }}
          --run-attempt ${{ github.run_attempt }}
          --out ${{ runner.temp }}/ncg-out/new-code-fragment.json

      - name: Upload new-code fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-code-fragment-${{ matrix.shard }}-of-${{ needs.new-code-plan.outputs.count }}
          path: ${{ runner.temp }}/ncg-out/new-code-fragment.json
          retention-days: 90
          if-no-files-found: warn
          # Re-running only this leg replaces the earlier attempt's fragment (#2304 RV-5).
          overwrite: true

  new-code-gate:
    name: new-code-gate
    needs: [new-code-plan, new-code-shard]
    # See the header: `always()` plus the explicit --plan-result and --shard-result below.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No pull-requests: read until the exception verifier lands (S5); no write tokens.
    permissions:
      contents: read
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download new-code plan
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: new-code-plan
          # A fresh directory outside the checkout, holding only this artifact (#2304 RV-7).
          path: ${{ runner.temp }}/ncg-in/plan

      - name: Download new-code fragments
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          # Filtered by the plan's count so that fragments left by an earlier attempt
          # with a different N are never fetched (TD 5.20.1, SH-6(a)).
          pattern: new-code-fragment-*-of-${{ needs.new-code-plan.outputs.count }}
          merge-multiple: false
          path: ${{ runner.temp }}/ncg-in/fragments

      # verdict is stdlib-only, so the system python is used and no venv is built.
      # The four binding values prove the plan and fragments were written by this run
      # (or an earlier attempt of it, for a re-run) for this PR and commit. The gate
      # creates ${{ runner.temp }}/ncg-out itself (outputs are written through a temp
      # file and os.replace), so this job needs no extra step (INV-G).
      - name: Apply thresholds
        env:
          HOS_PLAN_RESULT: ${{ needs.new-code-plan.result }}
          HOS_SHARD_RESULT: ${{ needs.new-code-shard.result }}
        run: >-
          python -I -c "import os, sys, types; r = os.path.realpath(sys.argv[1]); p = types.ModuleType('scripts'); p.__path__ = [os.path.join(r, 'scripts')]; sys.modules['scripts'] = p; from scripts.framework.new_code_gate import main; sys.exit(main(sys.argv[2:]))"
          ${{ github.workspace }} verdict
          --plan-dir ${{ runner.temp }}/ncg-in/plan
          --fragments-dir ${{ runner.temp }}/ncg-in/fragments
          --plan-result "$HOS_PLAN_RESULT"
          --shard-result "$HOS_SHARD_RESULT"
          --gated-sha ${{ github.sha }}
          --pr ${{ github.event.pull_request.number }}
          --run-id ${{ github.run_id }}
          --run-attempt ${{ github.run_attempt }}
          --records-out ${{ runner.temp }}/ncg-out/new-code-records.json
          --out ${{ runner.temp }}/ncg-out/new-code-verdict.json
          --summary ${{ runner.temp }}/ncg-out/new-code-summary.md

      - name: Publish step summary
        if: always()
        run: cat "${{ runner.temp }}/ncg-out/new-code-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload new-code verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-code-verdict
          path: |
            ${{ runner.temp }}/ncg-out/new-code-records.json
            ${{ runner.temp }}/ncg-out/new-code-verdict.json
            ${{ runner.temp }}/ncg-out/new-code-summary.md
          retention-days: 90
          if-no-files-found: warn
          overwrite: true
