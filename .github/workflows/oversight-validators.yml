name: Oversight validators

# Split into one job per dimension group (#1571 item 2) so a clean group can
# be promoted to a required status check without also requiring every other
# group bundled into the same job. Was previously a single
# `oversight-validators` job wrapping all ten dimensions plus their JS
# siblings — see DECISIONS.md's 2026-09-11 #1216 third-slice entry for how
# this suite was wired in before the split, and the 2026-09-12 #1571 entry
# for the debt baseline and promotion rationale below. Mirrors the
# oversight-gates.yml split (#1571 item 1): group by shared scope/trigger
# condition and shared debt profile, not one job per script.
#
# Per-group debt baseline (validator scripts run directly against every
# tracked file in their scope — the same full-project-scan spirit as the
# gates `--all` baseline — 2026-09-12; see DECISIONS.md for the full table):
#   oversight-validator-python   — zero debt AFTER a fix landed in this same
#                                  change: bandit 1.9.4 prints a "Working...
#                                  N%" progress-bar line to stdout ahead of
#                                  its JSON report once the scanned file
#                                  count crosses an internal threshold,
#                                  breaking static_analysis.py's
#                                  `json.loads(result.stdout)` on every
#                                  full-project scan. Fixed by passing `-q`
#                                  to bandit (scripts/oversight/validators/
#                                  static_analysis.py). All seven Python-
#                                  scoped dimensions (rn_calculator,
#                                  complexity_metrics, function_metrics,
#                                  n1_detector, static_analysis, hallucination
#                                  _surface, portability_check) run clean
#                                  against this repo's 195 tracked .py files.
#                                  PROMOTED to required.
#   oversight-validator-migration — zero debt against all ~8,650 tracked
#                                  files (migration_scorer scopes itself to
#                                  migration-shaped paths internally; this
#                                  repo has none, by design — non-Django).
#                                  PROMOTED to required.
#   oversight-validator-shell    — zero debt against all 81 tracked .sh
#                                  files (shell_logic_check's score is a
#                                  density signal, not pass/fail — the run
#                                  itself completed cleanly). PROMOTED to
#                                  required.
#   oversight-validator-diff-size — git-only, deterministic; no external tool
#                                  to crash on. Verified against a
#                                  representative multi-commit diff and the
#                                  empty-diff case. PROMOTED to required.
#   oversight-validator-js       — this repo has ZERO tracked .ts/.tsx/.js/
#                                  .jsx/.astro/.mjs/.cjs files and no
#                                  package.json, so there is no real corpus
#                                  to full-project-scan against — the
#                                  Python-group baseline method does not
#                                  apply. Each JS-scoped validator's own
#                                  pytest suite (tests/oversight/test_*_js.py)
#                                  passes, which is evidence the parsing/
#                                  scoring logic itself is sound, but that is
#                                  not equivalent to a real-code crash
#                                  baseline — bandit's progress-bar bug above
#                                  is exactly the class of defect a mocked
#                                  unit test cannot surface. Left ADVISORY
#                                  pending either real JS/TS content in this
#                                  repo (e.g. a future pack) or a deliberate
#                                  synthetic smoke corpus, whichever comes
#                                  first — deferred, not attempted here.
#
# ADVISORY (non-required) was the prior state for the whole suite, same
# rationale as oversight-gates.yml pre-split: proves each job runs clean
# before any decision to gate on it. The four PROMOTED groups above have now
# cleared that bar the same way oversight-gate-repo-scoped did for gates.
#
# This job calls the validator scripts directly, the same way
# oversight-gates.yml calls gate scripts directly rather than going through
# run_gates.sh's orchestrator. It deliberately does NOT call
# scripts/oversight/run_validators.sh — that script's committed-artifact
# writes (signoffs/validators/step{N}/summary.json) and composite-score/tier
# derivation remain the local risk-assessor's pipeline, unchanged by this
# slice (see run_validators.sh's own header + #1266 comment block for why
# PYTHONPATH/PATH must be set the way they are below).
#
# Failure semantics differ from oversight-gates.yml's gates, which are
# genuinely pass/fail (exit 0/1). These validators each emit a JSON
# {"dimension": ..., "score": 0.0-1.0, ...} signal, not a verdict — a job
# below only ever treats a validator as "failed" when the script errors,
# crashes, or times out, never based on the score value (score-threshold
# judgment is the risk-assessor's job). Every validator's dimension + score
# is printed for visibility; the job fails ONLY when a validator script
# itself errors/crashes/times out. Per-validator timeouts match
# run_validators.sh's VALIDATOR_TIMEOUT (60s, 120s for the two
# static_analysis variants).
#
# Every job below always runs (no job-level `if:`) and internally no-ops with
# an explicit "skipping" message + exit 0 when its scope's file list is empty
# — the same pattern oversight-gates.yml's per-gate jobs already use. This
# matters for branch-protection safety, not just style: a job gated with a
# workflow-level `if:` can end up "skipped" on many PRs, and a required
# status check that has never actually reported on a branch's history stays
# permanently "expected" and blocks every merge (#737, documented in
# setup_branch_protection.sh). Always-runs-but-may-no-op avoids that failure
# mode entirely, which is exactly why oversight-validator-js can stay
# structurally ready to promote later even though it never fires against
# this repo's current content.
#
# diff_size is git-only and deterministic; DS_CHANGED_LINES/DS_CHANGED_FILES/
# DS_FILE_LIST are computed here (not in the validator) exactly as
# run_validators.sh computes them, except base-ref resolution is simplified
# to origin/$GITHUB_BASE_REF directly — CI already fetches it, so the local
# fallback chain (merge-base → git describe → HEAD~1) doesn't apply.
#
# Deliberately NOT wired in here (stay local-only — see DECISIONS.md's
# 2026-09-11 #1216 third-slice entry for the full reasoning):
#   - ip_check.py       — calls ScanCode + PyPI; #1216's own body flags this
#                          as needing an explicit decision, not a default-yes.
#   - issue_query.py    — calls gh for issue history; network-dependent.
#   - prompt_audit_risk.py — calls gh for spec-gap count; network-dependent.
#
# Regular `pull_request` (not `pull_request_target`): validators run against
# the PR's own code, so this must use the PR head checkout and the
# restricted default GITHUB_TOKEN pull_request grants — same as
# oversight-gates.yml.

on:
  pull_request:
    branches: [main, "release/v*"]

permissions:
  contents: read

concurrency:
  group: oversight-validators-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  oversight-validator-python:
    name: oversight-validator-python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build oversight venv
        env:
          HOS_SKIP_PROJECT_REQUIREMENTS: "1"
        run: bash scripts/oversight/ensure_venv.sh

      - name: Run Python-scoped validators
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/oversight/ensure_venv.sh
          source scripts/oversight/ensure_venv.sh
          PYTHON="$OVERSIGHT_PYTHON"
          VALIDATORS_DIR="scripts/oversight/validators"
          export PYTHONPATH="$VALIDATORS_DIR${PYTHONPATH:+:$PYTHONPATH}"
          # #1266: static_analysis/complexity_metrics shell out to bandit/radon
          # via a PATH lookup, not a Python import.
          export PATH="$VENV_BIN:$PATH"

          git fetch origin "$GITHUB_BASE_REF" --depth=1
          BASE_RANGE="origin/$GITHUB_BASE_REF...HEAD"
          mapfile -t ALL_FILES < <(git diff --name-only "$BASE_RANGE")

          PY_FILES=()
          for f in "${ALL_FILES[@]}"; do
            [[ "$f" == *.py && -f "$f" ]] && PY_FILES+=("$f")
          done

          if [[ ${#PY_FILES[@]} -eq 0 ]]; then
            echo "No changed .py files against origin/$GITHUB_BASE_REF — skipping."
            exit 0
          fi

          RC=0

          run_val() {
            local name="$1" script="$2" timeout_s="$3"
            shift 3
            local args=("$@")

            if [[ ! -f "$script" ]]; then
              printf "  SKIP    %-24s (script not found)\n" "$name"
              return 0
            fi

            local out err rc
            out="$(mktemp)"
            err="$(mktemp)"
            if timeout "$timeout_s" "$PYTHON" "$script" "${args[@]}" >"$out" 2>"$err"; then
              rc=0
            else
              rc=$?
            fi

            if [[ $rc -eq 0 ]]; then
              local score dim
              score=$(PYTHONSAFEPATH=1 "$PYTHON" -c \
                "import json,sys; d=json.load(sys.stdin); print(f\"{d.get('score',0):.2f}\")" \
                <"$out" 2>/dev/null || echo "?")
              dim=$(PYTHONSAFEPATH=1 "$PYTHON" -c \
                "import json,sys; d=json.load(sys.stdin); print(d.get('dimension','?'))" \
                <"$out" 2>/dev/null || echo "$name")
              printf "  %-24s score=%s\n" "$dim" "$score"
            else
              echo "  FAILED  $name (exit=$rc, timeout=${timeout_s}s)"
              echo "  ---- stderr ----"
              sed 's/^/    /' "$err" || true
              echo "  -----------------"
              RC=1
            fi
            rm -f "$out" "$err"
          }

          echo "=== Python-scoped validators (${#PY_FILES[@]} file(s)) ==="
          run_val risk_number      "$VALIDATORS_DIR/rn_calculator.py"          60  "${PY_FILES[@]}"
          run_val complexity       "$VALIDATORS_DIR/complexity_metrics.py"     60  "${PY_FILES[@]}"
          run_val function_metrics "$VALIDATORS_DIR/function_metrics.py"       60  "${PY_FILES[@]}"
          run_val n1_queries       "$VALIDATORS_DIR/n1_detector.py"            60  "${PY_FILES[@]}"
          run_val static_analysis  "$VALIDATORS_DIR/static_analysis.py"       120  "${PY_FILES[@]}"
          run_val hallucination    "$VALIDATORS_DIR/hallucination_surface.py"  60  "${PY_FILES[@]}"
          run_val portability      "$VALIDATORS_DIR/portability_check.py"      60  "${PY_FILES[@]}"

          if [[ $RC -ne 0 ]]; then
            echo "One or more validators errored/crashed/timed out — see FAILED lines above."
          else
            echo "All Python-scoped validators completed. Scores above are informational" \
                 "signals for visibility, not a pass/fail verdict — threshold judgment is" \
                 "the risk-assessor's job, unchanged by this workflow."
          fi
          exit $RC

  oversight-validator-js:
    name: oversight-validator-js
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build oversight venv
        env:
          HOS_SKIP_PROJECT_REQUIREMENTS: "1"
        run: bash scripts/oversight/ensure_venv.sh

      - name: Run JS/TS-scoped validators
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/oversight/ensure_venv.sh
          source scripts/oversight/ensure_venv.sh
          PYTHON="$OVERSIGHT_PYTHON"
          VALIDATORS_DIR="scripts/oversight/validators"
          export PYTHONPATH="$VALIDATORS_DIR${PYTHONPATH:+:$PYTHONPATH}"
          export PATH="$VENV_BIN:$PATH"

          git fetch origin "$GITHUB_BASE_REF" --depth=1
          BASE_RANGE="origin/$GITHUB_BASE_REF...HEAD"
          mapfile -t ALL_FILES < <(git diff --name-only "$BASE_RANGE")

          JS_FILES=(); PKG_JSON_FILES=()
          JS_EXTS_RE='\.(ts|tsx|js|jsx|astro|mjs|cjs)$'
          for f in "${ALL_FILES[@]}"; do
            [[ "$f" =~ $JS_EXTS_RE && -f "$f" ]] && JS_FILES+=("$f")
            [[ "$(basename "$f")" == "package.json" && -f "$f" ]] && PKG_JSON_FILES+=("$f")
          done

          if [[ ${#JS_FILES[@]} -eq 0 && ${#PKG_JSON_FILES[@]} -eq 0 ]]; then
            echo "No changed JS/TS or package.json files against origin/$GITHUB_BASE_REF — skipping."
            exit 0
          fi

          RC=0

          run_val() {
            local name="$1" script="$2" timeout_s="$3"
            shift 3
            local args=("$@")

            if [[ ! -f "$script" ]]; then
              printf "  SKIP    %-24s (script not found)\n" "$name"
              return 0
            fi

            local out err rc
            out="$(mktemp)"
            err="$(mktemp)"
            if timeout "$timeout_s" "$PYTHON" "$script" "${args[@]}" >"$out" 2>"$err"; then
              rc=0
            else
              rc=$?
            fi

            if [[ $rc -eq 0 ]]; then
              local score dim
              score=$(PYTHONSAFEPATH=1 "$PYTHON" -c \
                "import json,sys; d=json.load(sys.stdin); print(f\"{d.get('score',0):.2f}\")" \
                <"$out" 2>/dev/null || echo "?")
              dim=$(PYTHONSAFEPATH=1 "$PYTHON" -c \
                "import json,sys; d=json.load(sys.stdin); print(d.get('dimension','?'))" \
                <"$out" 2>/dev/null || echo "$name")
              printf "  %-24s score=%s\n" "$dim" "$score"
            else
              echo "  FAILED  $name (exit=$rc, timeout=${timeout_s}s)"
              echo "  ---- stderr ----"
              sed 's/^/    /' "$err" || true
              echo "  -----------------"
              RC=1
            fi
            rm -f "$out" "$err"
          }

          if [[ ${#JS_FILES[@]} -gt 0 ]]; then
            echo "=== JS/TS-scoped validators (${#JS_FILES[@]} file(s)) ==="
            run_val risk_number_js      "$VALIDATORS_DIR/rn_calculator_js.py"       60  "${JS_FILES[@]}"
            run_val complexity_js       "$VALIDATORS_DIR/complexity_metrics_js.py"  60  "${JS_FILES[@]}"
            run_val function_metrics_js "$VALIDATORS_DIR/function_metrics_js.py"    60  "${JS_FILES[@]}"
            run_val n1_queries_js       "$VALIDATORS_DIR/n1_detector_js.py"         60  "${JS_FILES[@]}"
            run_val static_analysis_js  "$VALIDATORS_DIR/static_analysis_js.py"    120  "${JS_FILES[@]}"
            echo ""
          fi

          echo "=== hallucination_surface_js (JS/TS + package.json) ==="
          run_val hallucination_js "$VALIDATORS_DIR/hallucination_surface_js.py" 60 \
            "${JS_FILES[@]}" "${PKG_JSON_FILES[@]}"

          if [[ $RC -ne 0 ]]; then
            echo "One or more validators errored/crashed/timed out — see FAILED lines above."
          else
            echo "All JS/TS-scoped validators completed. Scores above are informational" \
                 "signals for visibility, not a pass/fail verdict — threshold judgment is" \
                 "the risk-assessor's job, unchanged by this workflow."
          fi
          exit $RC

  oversight-validator-migration:
    name: oversight-validator-migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build oversight venv
        env:
          HOS_SKIP_PROJECT_REQUIREMENTS: "1"
        run: bash scripts/oversight/ensure_venv.sh

      - name: Run migration_scorer
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/oversight/ensure_venv.sh
          source scripts/oversight/ensure_venv.sh
          PYTHON="$OVERSIGHT_PYTHON"
          VALIDATORS_DIR="scripts/oversight/validators"
          export PYTHONPATH="$VALIDATORS_DIR${PYTHONPATH:+:$PYTHONPATH}"

          git fetch origin "$GITHUB_BASE_REF" --depth=1
          mapfile -t ALL_FILES < <(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")

          if [[ ${#ALL_FILES[@]} -eq 0 ]]; then
            echo "No changed files against origin/$GITHUB_BASE_REF — skipping."
            exit 0
          fi

          out="$(mktemp)"; err="$(mktemp)"
          if timeout 60 "$PYTHON" "$VALIDATORS_DIR/migration_scorer.py" "${ALL_FILES[@]}" >"$out" 2>"$err"; then
            score=$("$PYTHON" -c "import json,sys; d=json.load(sys.stdin); print(f\"{d.get('score',0):.2f}\")" <"$out" 2>/dev/null || echo "?")
            echo "  migration_risk           score=$score"
            rm -f "$out" "$err"
          else
            rc=$?
            echo "  FAILED  migration_risk (exit=$rc, timeout=60s)"
            echo "  ---- stderr ----"
            sed 's/^/    /' "$err" || true
            rm -f "$out" "$err"
            exit 1
          fi

  oversight-validator-shell:
    name: oversight-validator-shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build oversight venv
        env:
          HOS_SKIP_PROJECT_REQUIREMENTS: "1"
        run: bash scripts/oversight/ensure_venv.sh

      - name: Run shell_logic_check
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/oversight/ensure_venv.sh
          source scripts/oversight/ensure_venv.sh
          PYTHON="$OVERSIGHT_PYTHON"
          VALIDATORS_DIR="scripts/oversight/validators"
          export PYTHONPATH="$VALIDATORS_DIR${PYTHONPATH:+:$PYTHONPATH}"

          git fetch origin "$GITHUB_BASE_REF" --depth=1
          mapfile -t ALL_FILES < <(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")

          SH_FILES=()
          for f in "${ALL_FILES[@]}"; do
            [[ "$f" == *.sh && -f "$f" ]] && SH_FILES+=("$f")
          done

          if [[ ${#SH_FILES[@]} -eq 0 ]]; then
            echo "No changed .sh files against origin/$GITHUB_BASE_REF — skipping."
            exit 0
          fi

          out="$(mktemp)"; err="$(mktemp)"
          if timeout 60 "$PYTHON" "$VALIDATORS_DIR/shell_logic_check.py" "${SH_FILES[@]}" >"$out" 2>"$err"; then
            score=$("$PYTHON" -c "import json,sys; d=json.load(sys.stdin); print(f\"{d.get('score',0):.2f}\")" <"$out" 2>/dev/null || echo "?")
            echo "  shell_logic              score=$score"
            rm -f "$out" "$err"
          else
            rc=$?
            echo "  FAILED  shell_logic (exit=$rc, timeout=60s)"
            echo "  ---- stderr ----"
            sed 's/^/    /' "$err" || true
            rm -f "$out" "$err"
            exit 1
          fi

  oversight-validator-diff-size:
    name: oversight-validator-diff-size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build oversight venv
        env:
          HOS_SKIP_PROJECT_REQUIREMENTS: "1"
        run: bash scripts/oversight/ensure_venv.sh

      - name: Run diff_size
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/oversight/ensure_venv.sh
          source scripts/oversight/ensure_venv.sh
          PYTHON="$OVERSIGHT_PYTHON"
          VALIDATORS_DIR="scripts/oversight/validators"
          export PYTHONPATH="$VALIDATORS_DIR${PYTHONPATH:+:$PYTHONPATH}"

          git fetch origin "$GITHUB_BASE_REF" --depth=1
          BASE_RANGE="origin/$GITHUB_BASE_REF...HEAD"
          mapfile -t ALL_FILES < <(git diff --name-only "$BASE_RANGE")

          if [[ ${#ALL_FILES[@]} -eq 0 ]]; then
            echo "No changed files against origin/$GITHUB_BASE_REF — skipping."
            exit 0
          fi

          # diff_size — git-only, deterministic. Computed here, not in the
          # validator (same division of labour as run_validators.sh's
          # DS_BASE_REF/DS_CHANGED_LINES/DS_CHANGED_FILES/DS_FILE_LIST block),
          # with base-ref resolution simplified to origin/$GITHUB_BASE_REF
          # since CI already fetched it above.
          DS_CHANGED_LINES=$(git diff --numstat "$BASE_RANGE" \
            | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { s += $1 + $2 } END { print s + 0 }')
          [[ "$DS_CHANGED_LINES" =~ ^[0-9]+$ ]] || DS_CHANGED_LINES=0
          DS_CHANGED_FILES=${#ALL_FILES[@]}

          out="$(mktemp)"; err="$(mktemp)"
          if timeout 30 "$PYTHON" "$VALIDATORS_DIR/diff_size.py" \
              --changed-lines "$DS_CHANGED_LINES" --changed-files "$DS_CHANGED_FILES" \
              --changed-file-list "${ALL_FILES[@]}" >"$out" 2>"$err"; then
            score=$("$PYTHON" -c "import json,sys; d=json.load(sys.stdin); print(f\"{d.get('score',0):.2f}\")" <"$out" 2>/dev/null || echo "?")
            echo "  diff_size                score=$score"
            cat "$err"
            rm -f "$out" "$err"
          else
            rc=$?
            echo "  FAILED  diff_size (exit=$rc, timeout=30s)"
            echo "  ---- stderr ----"
            sed 's/^/    /' "$err" || true
            rm -f "$out" "$err"
            exit 1
          fi
