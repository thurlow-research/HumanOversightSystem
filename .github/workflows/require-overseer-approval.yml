name: Require overseer approval (all PRs)

# Server-side enforcement that every PR has an APPROVED review from
# hos-overseer-hos[bot] before it may merge. Closes the gap (#621) where a
# human approval satisfied GitHub's "1 approving review" branch-protection
# requirement without the overseer ever having looked at the PR.
#
# Human approval is additive — for protected surfaces (CODEOWNERS) and
# CRITICAL-tier PRs a human approval is ALSO required, but it does NOT replace
# the overseer gate. The intentional escape hatch for the repo admin is GitHub's
# own "Merge without waiting for requirements" admin override (explicit, logged
# by GitHub), NOT a label or comment mechanism.
#
# Above-ceiling bypass (#1426): require-overseer-approval (this check) and
# require-tier-ceiling were jointly unsatisfiable for a PR whose tier exceeds
# OVERSEER_CEILING — the overseer correctly withholds APPROVED authority above
# its ceiling (docs/FABERIX-ROLES.md §5), which left this gate permanently
# unsatisfied. This script now also passes when the overseer posted SOME
# review (any state — it looked at the PR and deliberately did not approve
# above its ceiling) AND the PR's computed tier exceeds OVERSEER_CEILING AND a
# human (non-bot) has approved instead. This does not weaken #621: a human
# approval with NO overseer review at all still fails this gate.
#
# Pairs with:
#   require-human-approval  — protected-surface / CRITICAL tier gate
#   require-tier-ceiling    — overseer cannot merge above its ceiling
#
# To make it BLOCKING: add "require-overseer-approval" to the branch-protection
# "Require status checks to pass" list (see docs/MACHINE-ACCOUNTS-SETUP.md and
# scripts/framework/setup_branch_protection.sh).

# SECURITY: uses pull_request_TARGET, not pull_request. Under pull_request_target
# the workflow definition, the gate script, and machine-accounts.env all run from
# the TRUSTED BASE branch — NOT the PR's version. So a PR cannot edit this
# workflow or the gate script to neuter the check that gates it. The PR's reviews
# are read as DATA via gh API calls, never checked out and executed. (Same
# security model as require-human-approval.yml and require-tier-ceiling.yml.)
#
# SECURITY (#972, #1299): this workflow triggers on pull_request_TARGET ONLY.
# It used to ALSO trigger on pull_request_review, where GITHUB_REF is the PR's
# MERGE ref (base+head) rather than the base branch — a bare `actions/checkout@v4`
# there would check out and execute the PR's OWN copy of the gate script,
# reintroducing the self-bypass this header warns about. That second trigger also
# produced a SECOND check run of this job's name for the PR, so a stale FAILURE
# from the first one kept blocking merge even after an approval landed (#1299).
# Review-triggered re-evaluation now happens by RERUNNING this workflow run in
# place — see .github/workflows/rerun-gate-checks.yml, which invokes
# scripts/framework/rerun_gate_checks.py. A rerun replays this run's ORIGINAL
# pull_request_target event, so it UPDATES the existing check run instead of
# creating a duplicate. Do NOT re-add a pull_request_review trigger here;
# tests/framework/test_gate_checkout_pinned_base.py fails if you do. The
# `ref: base.sha` pin below STAYS as defence-in-depth.
on:
  pull_request_target:
    branches: [main, "release/v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  require-overseer-approval:
    # The job `name` IS the status-check context GitHub reports to branch
    # protection. It MUST equal the required context in
    # scripts/framework/setup_branch_protection.sh (`require-overseer-approval`),
    # or the required context stays permanently "expected" and every merge
    # returns HTTP 405 while the gate appears green (#737). Keep these in sync;
    # tests/framework/test_branch_protection_contexts.py enforces it.
    name: require-overseer-approval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (TRUSTED base — never the PR head or merge ref)
        # Pin the base SHA explicitly. Under pull_request_target the default ref
        # is already the base, so this is a no-op today — it is kept as
        # defence-in-depth so that re-adding any non-target trigger (see #972 /
        # #1299 above) cannot silently start executing PR content. Do NOT change
        # this to `${{ github.event.pull_request.head.sha }}` or the merge ref.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Overseer approval gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 scripts/framework/require_overseer_approval.py \
            --pr "$PR_NUMBER"
